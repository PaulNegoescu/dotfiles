# https://starship.rs/config/
# Run `starship explain` to help dissect the current prompt

# Allow longer-running commands to keep executing without failing with a warning
command_timeout = 1000

format = """\
${custom.path}\
${custom.git}\
$line_break\
$character\
"""

[custom.path]
command = '$HOME/.dotfiles/bin/starship-path'
when = true
shell = ["/bin/sh"]
format = "[$output]($style) "
style = "bold #6FC1FF"
description = "Current directory with middle truncation"
# Set STARSHIP_PATH_MAX_LENGTH in ~/.zsh.local to override the default of 54.

[custom.git]
command = '$HOME/.dotfiles/bin/starship-git'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
shell = ["/bin/sh"]
format = "[$output]($style) "
style = "bold #B084EB"
description = "Git branch, worktree state, and upstream divergence"
# Ahead/behind counts use the tracking ref from the most recent `git fetch`.

[character]
# Nerd Fonts nf-fa-angle_right \uf105
success_symbol = "[](bold #19F9D8)"
error_symbol = "[](bold #FF4B82)"
